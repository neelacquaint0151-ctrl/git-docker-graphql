services:
  gateway:
    build: .
    command: npm run start
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001/graphql
      - USER_SERVICE_URL=http://user-service:4002/graphql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - METADATA_SERVER_DETECTION=none
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      redis:
        condition: service_healthy

  auth-service:
    build: .
    command: npm run start:auth
    ports:
      - "4001:4001"
    environment:
      - AUTH_SERVICE_PORT=4001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - METADATA_SERVER_DETECTION=none
    depends_on:
      redis:
        condition: service_healthy

  user-service:
    build: .
    command: npm run start:user
    ports:
      - "4002:4002"
    environment:
      - USER_SERVICE_PORT=4002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mydb?schema=public
      - METADATA_SERVER_DETECTION=none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --protected-mode no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
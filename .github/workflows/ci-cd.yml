name: Microservices CI/CD

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  test-and-validate:
    name: Lint, Test, and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Automatically caches node_modules for faster runs

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Tests
        # The --if-present flag ensures this won't fail if you haven't written tests yet
        run: npm run test --if-present

  docker-build:
    name: Build Production Docker Image
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to true later when you configure a Docker registry (Docker Hub / AWS ECR)
          tags: microservices-app:latest
          # Use GitHub Actions cache to dramatically speed up Docker builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
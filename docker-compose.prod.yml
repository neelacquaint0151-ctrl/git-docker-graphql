x-common-service: &common-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  network_mode: "host"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *common-service
    command: npm run start
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - AUTH_SERVICE_URL=http://127.0.0.1:4001/graphql
      - USER_SERVICE_URL=http://127.0.0.1:4002/graphql
      - METADATA_SERVER_DETECTION=none

  auth-service:
    <<: *common-service
    command: npm run start:auth
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=4001
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - HTTPSMS_API_KEY=${HTTPSMS_API_KEY}
      - METADATA_SERVER_DETECTION=none

  user-service:
    <<: *common-service
    command: npm run start:user
    environment:
      - NODE_ENV=production
      - USER_SERVICE_PORT=4002
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/mydb?schema=public
      - METADATA_SERVER_DETECTION=none

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: "host"
    command: redis-server --appendonly yes --protected-mode no

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: "host"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: